services:
  app:
    build: .
    environment:
      PPG_API_KEY: ${PPG_API_KEY:?set PPG_API_KEY}
      PPG_DATABASE_URL: sqlite:////data/priceguard.db
      PPG_WEBHOOK_URL: ${PPG_WEBHOOK_URL:-}
      PPG_MAX_RESPONSE_BYTES: ${PPG_MAX_RESPONSE_BYTES:-5242880}
    volumes:
      - priceguard-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  priceguard-data:
